<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إصدار أمر شراء - نظام الجمارك والمخازن</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: "Tahoma", sans-serif; }
        .page-container { max-width: 900px; margin: 30px auto; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .card-header { background: #0f172a; color: white; border-radius: 15px 15px 0 0 !important; padding: 20px; }
        .btn-save { background: #2563eb; color: white; padding: 10px 30px; font-weight: bold; }
        .btn-save:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>

<div class="page-container">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">إصدار أمر شراء جديد</h4>
        </div>
        <div class="card-body p-4">
            <form action="/save_purchase_order" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">اختر طلب الشراء (اختياري)</label>
                        <select name="requisition_id" class="form-select" id="requisition_select">
                            <option value="">-- لا توجد طلبات معلقة --</option>
                            {% for req in requisitions %}
                            <option value="{{ req.id }}" data-item="{{ req.item_id }}" data-qty="{{ req.quantity }}">
                                طلب #{{ req.id }} - {{ req.item_name_ar }} ({{ req.quantity }} وحدة)
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">اختر المورد</label>
                        <select name="vendor_id" class="form-select" required>
                            <option value="">-- اختر المورد --</option>
                            {% for vendor in vendors %}
                            <option value="{{ vendor.id }}">{{ vendor.supplier_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">اختر الصنف</label>
                        <select name="item_id" class="form-select" id="item_select" required>
                            <option value="">-- اختر الصنف --</option>
                            {% for item in items %}
                            <option value="{{ item.id }}">{{ item.item_name_ar }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">الكمية</label>
                        <input type="number" name="quantity" id="quantity_input" class="form-control" placeholder="أدخل الكمية" required>
                    </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">سعر الوحدة (ج.م)</label>
                            <input type="number" step="0.01" min="0" name="unit_price" class="form-control" placeholder="أدخل سعر الوحدة (اختياري)">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">تاريخ الطلب</label>
                            <input type="date" name="order_date" class="form-control" required>
                        </div>
                </div>

                <div class="text-end mt-4">
                    <a href="/purchase-orders" class="btn btn-outline-secondary px-4">رجوع</a>
                    <button type="submit" class="btn btn-save" id="submitBtn">حفظ الطلب</button>
                </div>
            </form>

            <script>
                document.getElementById('requisition_select').addEventListener('change', function() {
                    var option = this.options[this.selectedIndex];
                    if (option.value) {
                        var itemId = option.getAttribute('data-item');
                        var qty = option.getAttribute('data-qty');
                        document.getElementById('item_select').value = itemId;
                        document.getElementById('quantity_input').value = qty;
                    }
                });

                // Auto-fill from URL parameters
                window.addEventListener('DOMContentLoaded', function() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const requisitionId = urlParams.get('requisition_id');
                    
                    if (requisitionId) {
                        document.getElementById('requisition_select').value = requisitionId;
                        document.getElementById('requisition_select').dispatchEvent(new Event('change'));
                    }
                });

                // Validate form before submission
                document.querySelector('form').addEventListener('submit', function(e) {
                    const vendorId = document.querySelector('[name="vendor_id"]').value;
                    const itemId = document.querySelector('[name="item_id"]').value;
                    const quantity = document.querySelector('[name="quantity"]').value;
                    const orderDate = document.querySelector('[name="order_date"]').value;

                    let errors = [];
                    
                    if (!vendorId) errors.push('يرجى اختيار المورد');
                    if (!itemId) errors.push('يرجى اختيار الصنف');
                    if (!quantity || quantity <= 0) errors.push('يرجى إدخال كمية صحيحة');
                    if (!orderDate) errors.push('يرجى اختيار تاريخ الطلب');

                    if (errors.length > 0) {
                        e.preventDefault();
                        alert('خطأ في البيانات:\n\n' + errors.join('\n'));
                        return false;
                    }
                });
            </script>
        </div>
    </div>
</div>

</body>
</html>
