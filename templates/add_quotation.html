{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="fas fa-plus-circle"></i> تسجيل عرض سعر جديد</h3>
        </div>
        
        <div class="card-body">
            <p class="text-muted">لطلب الشراء رقم: <strong>{{ req_id }}</strong></p>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">اختر المورد *</label>
                    <select name="vendor_id" class="form-select" required>
                        <option value="" disabled selected>-- اختر المورد --</option>
                        {% for vendor in vendors %}
                        <option value="{{ vendor.id }}">{{ vendor.supplier_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">السعر (ج.م) *</label>
                    <input type="number" step="0.01" name="price" class="form-control" placeholder="0.00" required>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> حفظ عرض السعر
                    </button>
                    <a href="/requisitions" class="btn btn-secondary">
                        <i class="fas fa-times"></i> إلغاء
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
