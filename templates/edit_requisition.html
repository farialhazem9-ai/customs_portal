<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل طلب الشراء</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3>تعديل طلب الشراء رقم: {{ req.id }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">الكمية</label>
                        <input type="number" name="quantity" class="form-control" value="{{ req.quantity }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">السبب</label>
                        <textarea name="reason" class="form-control" rows="3">{{ req.reason }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-success">حفظ التعديلات</button>
                    <a href="/requisitions" class="btn btn-secondary">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
