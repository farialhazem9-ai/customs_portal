{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>إذن صرف مواد</h3>
        </div>

        <div class="card-body">

            <form method="POST">
                {% if csrf_token is defined %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% endif %}

                <div class="row">

                    <div class="col-md-3">
                        <label>رقم الإذن</label>
                        <input type="text"
                               name="voucher_no"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>التاريخ</label>
                        <input type="date"
                               name="issue_date"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>القسم</label>
                        <input type="text"
                               name="department"
                               class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>المستلم</label>
                        <input type="text"
                               name="receiver_name"
                               class="form-control">
                    </div>

                </div>

                <div class="mt-3">
                    <label>ملاحظات</label>
                    <textarea name="notes"
                              class="form-control"></textarea>
                </div>

                <hr>

                <h5>الأصناف المصروفة</h5>

                <table class="table table-bordered" id="itemsTable">

                    <thead class="table-light">
                        <tr>
                            <th>الصنف</th>
                            <th>الكمية</th>
                            <th>سعر الوحدة</th>
                            <th>الإجمالي</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                <select name="item_id[]"
                                        class="form-control"
                                        required>

                                    {% for item in items %}
                                    <option value="{{ item.id }}">
                                        {{ item.item_name_ar }}
                                    </option>
                                    {% endfor %}

                                </select>
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       name="qty[]"
                                       class="form-control qty"
                                       required>
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       name="unit_price[]"
                                       class="form-control price">
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       class="form-control total"
                                       readonly>
                            </td>

                            <td>
                                <button type="button"
                                        class="btn btn-danger"
                                        onclick="removeRow(this)">
                                    حذف
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

                <button type="button"
                        class="btn btn-info"
                        onclick="addRow()">
                    إضافة صنف
                </button>

                <hr>

                <div class="row">

                    <div class="col-md-3 offset-md-9">
                        <label>الإجمالي الكلي</label>
                        <input type="text"
                               id="grandTotal"
                               class="form-control"
                               readonly>
                    </div>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">
                        حفظ إذن الصرف
                    </button>

                    <a href="/issue-vouchers"
                       class="btn btn-secondary">
                        رجوع
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

function addRow() {

    let table =
        document.querySelector("#itemsTable tbody");

    let firstRow =
        table.rows[0];

    let newRow =
        firstRow.cloneNode(true);

    newRow.querySelectorAll("input")
          .forEach(input => {
              input.value = "";
          });

    table.appendChild(newRow);
}

function removeRow(btn) {

    let rows =
        document.querySelectorAll(
            "#itemsTable tbody tr"
        );

    if(rows.length > 1){
        btn.closest("tr").remove();
        calculateTotals();
    }
}

document.addEventListener(
    "input",
    function(e){

        if(
            e.target.classList.contains("qty")
            ||
            e.target.classList.contains("price")
        ){
            calculateTotals();
        }

    }
);

function calculateTotals(){

    let grand = 0;

    document
    .querySelectorAll("#itemsTable tbody tr")
    .forEach(row => {

        let qty =
            parseFloat(
                row.querySelector(".qty").value
            ) || 0;

        let price =
            parseFloat(
                row.querySelector(".price").value
            ) || 0;

        let total = qty * price;

        row.querySelector(".total")
           .value = total.toFixed(2);

        grand += total;
    });

    document.getElementById(
        "grandTotal"
    ).value = grand.toFixed(2);
}

</script>

{% endblock %}
