{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>إذن صرف مواد</h3>
        </div>

        <div class="card-body">

            <form method="POST">
                {% if csrf_token is defined %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% endif %}

                <div class="row">

                    <div class="col-md-3">
                        <label>رقم الإذن</label>
                        <input type="text"
                               name="voucher_no"
                               id="voucherNo"
                               class="form-control"
                               value="{{ voucher_no_preview }}"
                               readonly
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>التاريخ</label>
                        <input type="date"
                               name="issue_date"
                               id="issueDate"
                               class="form-control"
                               value="{{ default_issue_date }}"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>القسم</label>
                        <select name="department" id="departmentSelect" class="form-select" required>
                            {% for department in departments %}
                            <option value="{{ department.department }}" {% if department.department == selected_department %}selected{% endif %}>
                                {{ department.department }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>المستلم</label>
                        <input type="text"
                               name="receiver_name"
                               class="form-control">
                    </div>

                </div>

                <div class="mt-3">
                    <label>ملاحظات</label>
                    <textarea name="notes"
                              class="form-control"></textarea>
                </div>

                <hr>

                <h5>الأصناف المصروفة</h5>

                <table class="table table-bordered" id="itemsTable">

                    <thead class="table-light">
                        <tr>
                            <th>الصنف</th>
                            <th>المخزن</th>
                            <th>الرصيد المتاح</th>
                            <th>الكمية</th>
                            <th>سعر الوحدة</th>
                            <th>الإجمالي</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                <select name="item_id[]"
                                        class="form-control item-selector"
                                        required>
                                    <option value="">اختر الصنف</option>
                                    {% for item in items %}
                                    <option value="{{ item.id }}"
                                            data-department="{{ item.department }}"
                                            data-store-id="{{ item.store_id }}"
                                            data-store-name="{{ item.store_name }}"
                                            data-stock="{{ item.store_quantity }}"
                                            data-last-purchase-price="{{ item.last_purchase_price }}">
                                        {{ item.item_code }} - {{ item.item_name_ar }} | {{ item.store_name }} | المتاح {{ item.store_quantity }} | آخر شراء {{ item.last_purchase_price }}
                                    </option>
                                    {% endfor %}

                                </select>
                            </td>

                            <td>
                                <input type="hidden" name="store_id[]" class="item-store-id">
                                <input type="text" class="form-control item-store-name" readonly>
                            </td>

                            <td>
                                <input type="text" class="form-control item-stock" readonly>
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       name="qty[]"
                                       class="form-control qty"
                                       required>
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       name="unit_price[]"
                                       class="form-control price">
                            </td>

                            <td>
                                <input type="number"
                                       step="0.01"
                                       class="form-control total"
                                       readonly>
                            </td>

                            <td>
                                <button type="button"
                                        class="btn btn-danger"
                                        onclick="removeRow(this)">
                                    حذف
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

                <button type="button"
                        class="btn btn-info"
                        onclick="addRow()">
                    إضافة صنف
                </button>

                <hr>

                <div class="row">

                    <div class="col-md-3 offset-md-9">
                        <label>الإجمالي الكلي</label>
                        <input type="text"
                               id="grandTotal"
                               class="form-control"
                               readonly>
                    </div>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">
                        حفظ إذن الصرف
                    </button>

                    <a href="/issue-vouchers"
                       class="btn btn-secondary">
                        رجوع
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

function addRow() {

    let table =
        document.querySelector("#itemsTable tbody");

    let firstRow =
        table.rows[0];

    let newRow =
        firstRow.cloneNode(true);

    newRow.querySelectorAll("input")
          .forEach(input => {
              input.value = "";
          });
    newRow.querySelector(".item-selector").selectedIndex = 0;

    table.appendChild(newRow);
    filterRowItems(newRow);
}

function filterRowItems(row) {
    const department = document.getElementById("departmentSelect").value;
    const select = row.querySelector('select[name="item_id[]"]');
    Array.from(select.options).forEach(option => {
        option.hidden = !option.value
            ? false
            : option.dataset.department !== department;
    });
    if (select.selectedOptions.length && select.selectedOptions[0].hidden) {
        select.selectedIndex = 0;
        row.querySelector(".item-store-id").value = "";
        row.querySelector(".item-store-name").value = "";
        row.querySelector(".item-stock").value = "";
        row.querySelector(".qty").value = "";
        row.querySelector(".price").value = "";
        row.querySelector(".total").value = "";
    }
}

document.addEventListener("change", function (event) {
    const select = event.target;
    if (!select.classList.contains("item-selector")) return;
    const option = select.selectedOptions[0];
    if (!option || !option.value) return;
    const row = select.closest("tr");
    row.querySelector(".item-store-id").value = option.dataset.storeId;
    row.querySelector(".item-store-name").value = option.dataset.storeName;
    row.querySelector(".item-stock").value = option.dataset.stock;
    const priceInput = row.querySelector(".price");
    priceInput.value = option.dataset.lastPurchasePrice || "0";
    calculateTotals();
});

document.getElementById("departmentSelect").addEventListener("change", function () {
    document.querySelectorAll("#itemsTable tbody tr").forEach(filterRowItems);
    calculateTotals();
});

document.getElementById("issueDate").addEventListener("change", async function () {
    const response = await fetch(`/issue-vouchers/next-number?date=${encodeURIComponent(this.value)}`);
    if (response.ok) {
        const result = await response.json();
        document.getElementById("voucherNo").value = result.voucher_no;
    }
});

document.querySelectorAll("#itemsTable tbody tr").forEach(filterRowItems);

function removeRow(btn) {

    let rows =
        document.querySelectorAll(
            "#itemsTable tbody tr"
        );

    if(rows.length > 1){
        btn.closest("tr").remove();
        calculateTotals();
    }
}

document.addEventListener(
    "input",
    function(e){

        if(
            e.target.classList.contains("qty")
            ||
            e.target.classList.contains("price")
        ){
            calculateTotals();
        }

    }
);

function calculateTotals(){

    let grand = 0;

    document
    .querySelectorAll("#itemsTable tbody tr")
    .forEach(row => {

        let qty =
            parseFloat(
                row.querySelector(".qty").value
            ) || 0;

        let price =
            parseFloat(
                row.querySelector(".price").value
            ) || 0;

        let total = qty * price;

        row.querySelector(".total")
           .value = total.toFixed(2);

        grand += total;
    });

    document.getElementById(
        "grandTotal"
    ).value = grand.toFixed(2);
}

</script>

{% endblock %}
