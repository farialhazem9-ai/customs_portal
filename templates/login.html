<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام الجمارك والمخازن</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: "Tahoma", sans-serif;
    margin:0; padding:0;
    height:100vh;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('/static/images/login-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:420px;
    background: rgba(255,255,255,0.9);
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.login-title{
    text-align:center;
    color:#0f172a;
    margin-bottom:15px;
    font-weight:bold;
}

.form-control{
    height:45px;
    border-radius:12px;
    margin-bottom:15px;
}

.btn-login{
    width:100%;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
    background:#2563eb;
    color:white;
    border:none;
}

.btn-login:hover{
    background:#1d4ed8;
}

.alert{
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-card">
    <h3 class="login-title">نظام الجمارك والمخازن</h3>
    <p class="text-center text-muted">الرجاء تسجيل الدخول للمتابعة</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% if csrf_token is defined %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}
        <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required>
        <input type="password" name="password" class="form-control" placeholder="كلمة المرور" required>
        <button type="submit" class="btn btn-login">تسجيل الدخول</button>
    </form>

    <p class="text-center text-muted mt-3" style="font-size:13px;">© 2026 نظام إدارة الجمارك والمخازن</p>
</div>

</body>
</html>
