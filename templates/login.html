<!DOCTYPE html>
<html lang="{{ current_language or 'ar' }}" dir="{{ 'ltr' if current_language == 'en' else 'rtl' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Sign in | Customs, Local & External Purchases System' if current_language == 'en' else 'تسجيل الدخول | نظام الجمارك والمشتريات المحلية والخارجية' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f1012;
            background-image: 
                radial-gradient(circle at 20% 25%, rgba(180, 140, 70, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(20, 20, 25, 0.8) 0%, transparent 50%);
            overflow: hidden;
            color: #fff;
        }

        .login-card {
            width: min(92vw, 420px);
            padding: 52px 40px 42px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .welcome-text {
            color: #ffffff;
            font-size: 32px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .login-label {
            display: block;
            color: #9a9a9e;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group input::placeholder {
            color: #525258;
            font-weight: 300;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.2),
                0 0 15px rgba(212, 175, 55, 0.15);
        }

        .btn-login {
            width: 100%;
            height: 56px;
            margin-top: 12px;
            background: linear-gradient(135deg,
                #cda052 0%,
                #fdf1a9 35%,
                #d8ad5a 70%,
                #a87c33 100%
            );
            border: none;
            border-radius: 20px;
            color: #121212;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 8px 25px rgba(180, 140, 70, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.8);
            letter-spacing: -0.2px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px rgba(212, 175, 55, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
            filter: brightness(1.05);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(180, 140, 70, 0.2);
        }

        .alert {
            margin-bottom: 12px;
            font-size: 14px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="welcome-text">Welcome</div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% if csrf_token is defined %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}

            <div class="input-group">
                <label class="login-label">Username</label>
                <input type="text" name="username" placeholder="admin" required>
            </div>

            <div class="input-group">
                <label class="login-label">Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
