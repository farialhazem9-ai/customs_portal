{% extends 'base.html' %}
{% block title %}{% if employee %}تعديل موظف{% else %}إضافة موظف{% endif %}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
  <div class="card shadow-sm border-0 mx-auto" style="max-width: 1100px;">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="mb-1">{% if employee %}تعديل بيانات الموظف{% else %}إضافة موظف جديد{% endif %}</h3>
          <small class="text-muted">إدارة الملف الوظيفي والبيانات الأساسية</small>
        </div>
        <a href="/hr/employees" class="btn btn-outline-secondary btn-sm">عودة إلى القائمة</a>
      </div>

      <form method="post">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">كود الموظف</label>
            <input name="employee_number" class="form-control" value="{{ employee.employee_number if employee }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">الاسم الأول</label>
            <input name="first_name" class="form-control" value="{{ employee.first_name if employee }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">اسم العائلة</label>
            <input name="last_name" class="form-control" value="{{ employee.last_name if employee }}" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">الرقم القومي</label>
            <input name="national_id" class="form-control" value="{{ employee.national_id if employee }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">الإدارة</label>
            <select name="department_id" class="form-select">
              <option value="">اختر الإدارة</option>
              {% for department in departments %}
              <option value="{{ department.id }}" {% if employee and employee.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">المسمى الوظيفي</label>
            <input name="job_title" class="form-control" value="{{ employee.job_title if employee }}" placeholder="محاسب - مخلص جمركي - أمين مخزن">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">تاريخ التعيين</label>
            <input type="date" name="hire_date" class="form-control" value="{{ employee.hire_date if employee and employee.hire_date else '' }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">الراتب الأساسي</label>
            <input type="number" step="0.01" name="salary" class="form-control" value="{{ employee.salary if employee }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">الحالة</label>
            <select name="status" class="form-select">
              <option value="Active" {% if employee and employee.status == 'Active' %}selected{% endif %}>نشط</option>
              <option value="On Leave" {% if employee and employee.status == 'On Leave' %}selected{% endif %}>في إجازة</option>
              <option value="Inactive" {% if employee and employee.status == 'Inactive' %}selected{% endif %}>موقوف</option>
              <option value="Terminated" {% if employee and employee.status == 'Terminated' %}selected{% endif %}>مستقيل</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">رقم الهاتف</label>
            <input name="phone" class="form-control" value="{{ employee.phone if employee }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">البريد الإلكتروني</label>
            <input type="email" name="email" class="form-control" value="{{ employee.email if employee }}">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <div class="form-check form-switch mt-4">
              <input class="form-check-input" type="checkbox" name="active" id="activeEmployee" {% if not employee or employee.active %}checked{% endif %}>
              <label class="form-check-label fw-bold" for="activeEmployee">موظف نشط</label>
            </div>
          </div>

          <div class="col-12 mt-4">
            <button class="btn btn-primary">حفظ البيانات</button>
            <a href="/hr/employees" class="btn btn-secondary">إلغاء</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
