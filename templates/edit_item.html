{% extends "base.html" %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4">

    <div class="card shadow-lg border-0">
        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0">✏️ تعديل بيانات الصنف والرصيد</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">كود الصنف</label>
                        <input type="text" name="item_code" class="form-control" value="{{ item.item_code }}" required>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label">اسم الصنف</label>
                        <input type="text" name="item_name_ar" class="form-control" value="{{ item.item_name_ar }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">النوع</label>
                        <input type="text" name="item_type" class="form-control" value="{{ item.item_type }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الإدارة</label>
                        <select class="form-select" name="department" required>
                            <option value="local_purchases" {% if (item.department or 'local_purchases') == 'local_purchases' %}selected{% endif %}>المشتريات المحلية</option>
                            <option value="external_purchases" {% if (item.department or 'local_purchases') == 'external_purchases' %}selected{% endif %}>المشتريات الخارجية</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">رقم الوارد</label>
                        <input type="text" name="receipt_no" class="form-control" value="{{ item.receipt_no }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">أمر الشراء</label>
                        <input type="text" name="po_number" class="form-control" value="{{ item.po_number }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الفئة</label>
                        <select class="form-select" name="category_id" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id == item.category_id %}selected{% endif %}>
                                {{ cat.category_name_ar }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الوحدة</label>
                        <select name="unit_id" class="form-select" required>
                            {% for u in units %}
                            <option value="{{ u.id }}" {% if u.id == item.unit_id %}selected{% endif %}>
                                {{ u.unit_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الكمية (الرصيد)</label>
                        <input type="number" step="0.01" id="qty" name="qty" class="form-control" value="{{ item.qty }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">سعر الوحدة</label>
                        <input type="number" step="0.01" id="unit_price" name="unit_price" class="form-control" value="{{ item.unit_price }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">السعر الافتراضي</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ item.price }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الوزن (كجم)</label>
                        <input type="number" step="0.001" name="weight" class="form-control" value="{{ item.weight }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">تكلفة الشحن</label>
                        <input type="number" step="0.01" id="shipping_cost" name="shipping_cost" class="form-control" value="{{ item.shipping_cost }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">الإجمالي</label>
                        <input type="number" id="total_cost" class="form-control bg-light" value="{{ item.total_cost }}" readonly>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning btn-lg text-dark fw-bold">
                        💾 تحديث البيانات وحفظ الرصيد
                    </button>
                    <a href="/items" class="btn btn-secondary btn-lg">
                        رجوع
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<script>
function calcTotal() {
    let qty = parseFloat(document.getElementById("qty").value) || 0;
    let unit = parseFloat(document.getElementById("unit_price").value) || 0;
    let ship = parseFloat(document.getElementById("shipping_cost").value) || 0;

    let total = (qty * unit) + ship;
    document.getElementById("total_cost").value = total.toFixed(2);
}

document.getElementById("qty").addEventListener("input", calcTotal);
document.getElementById("unit_price").addEventListener("input", calcTotal);
document.getElementById("shipping_cost").addEventListener("input", calcTotal);
</script>

{% endblock %}
